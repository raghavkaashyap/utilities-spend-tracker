# Use H2 in-memory database for tests (Fast, isolated, no MySQL needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate settings for tests (Create schema automatically)
spring.jpa.hibernate.ddl-auto=create-drop

# JWT Secret for tests
ust.jwt.secret=test-secret-key-for-unit-testing-only-do-not-use-in-prod
ust.jwt.expiration-seconds=3600